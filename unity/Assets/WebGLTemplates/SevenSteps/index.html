<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Seven Steps page (docs/architecture.md 14.10, production/ui-layout-fix.md): the canvas fills the window at 16:9
         (letterboxed), the page around it is the game's dark navy (UiTheme panelBg #101C32). -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101C32; }
      #unity-canvas { position: absolute; display: block; background: #101C32; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; width: 40%; transform: translate(-50%, -50%); }
      #loading-bar { height: 6px; background: #2A3A55; border-radius: 3px; overflow: hidden; }
      #loading-fill { height: 100%; width: 0; background: #C9AB6B; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"><div id="loading-fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Fit the window keeping 16:9; centered, the rest is the page color.
      function fit() {
        var w = window.innerWidth, h = window.innerHeight, ratio = 16 / 9;
        var cw = Math.min(w, h * ratio), ch = cw / ratio;
        canvas.style.width = Math.floor(cw) + "px";
        canvas.style.height = Math.floor(ch) + "px";
        canvas.style.left = Math.floor((w - cw) / 2) + "px";
        canvas.style.top = Math.floor((h - ch) / 2) + "px";
      }
      window.addEventListener("resize", fit);
      fit();
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Render at the canvas CSS size (matchWebGLToCanvasSize, default true) x 1: on high-DPI screens the default
        // ratio would draw 4x the pixels (docs/reviews/2026-11-10-webgl-fps-candidates.md, candidate 1).
        devicePixelRatio: 1,
      }, function (progress) {
        document.querySelector("#loading-fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
